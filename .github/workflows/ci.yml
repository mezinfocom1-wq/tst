name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: salon
          POSTGRES_DB: salon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://salon:salon@localhost:5432/salon_test?schema=public
      TEST_DATABASE_URL: postgresql://salon:salon@localhost:5432/salon_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @salon/api db:generate
      - run: pnpm --filter @salon/api typecheck
      - run: pnpm --filter @salon/api test

  web:
    name: Web (types et construction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @salon/web typecheck
      - run: pnpm --filter @salon/web build

  mobile:
    name: Mobile (types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
